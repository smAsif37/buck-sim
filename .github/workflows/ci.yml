name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit + API tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: python -m pytest -m "not ngspice and not ltspice" -q

  windows:
    name: Unit + API tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -m "not ngspice and not ltspice" -q

  ngspice:
    name: Real simulation with ngspice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ngspice
      - run: python -m pip install -e ".[dev]"
      - run: ngspice --version | head -n 3
      - run: buck-sim selftest --engine ngspice
      - run: python -m pytest -m ngspice -v

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t buck-sim:ci .
      - run: docker run --rm buck-sim:ci buck-sim --version
      - run: docker run --rm buck-sim:ci buck-sim selftest --engine ngspice
