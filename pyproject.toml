[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buck-sim"
version = "0.1.0"
description = "Web service that runs buck-converter SPICE test suites (LTspice / ngspice) on uploaded netlists"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.6,<3",
  "starlette>=0.40,<2",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9",
  "spicelib>=1.4,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "requests>=2.31",
  "ruff>=0.5",
]

[project.scripts]
buck-sim = "buck_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
buck_sim = ["static/*", "examples/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "ngspice: needs the ngspice binary on PATH",
  "ltspice: needs a working LTspice install (LTSPICE_CMD)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F"]
